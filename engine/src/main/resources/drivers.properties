# The JDBC drivers inside dbpadu-engine.jar. Versions are filled in by
# Maven from engine/pom.xml when the engine is built.
kinds=postgres,mysql,mariadb,sqlserver,oracle,sqlite

postgres.name=PostgreSQL JDBC Driver
postgres.package=org.postgresql:postgresql
postgres.class=org.postgresql.Driver
postgres.version=${postgresql.version}

mysql.name=MySQL Connector/J
mysql.package=com.mysql:mysql-connector-j
mysql.class=com.mysql.cj.jdbc.Driver
mysql.version=${mysql.version}

mariadb.name=MariaDB Connector/J
mariadb.package=org.mariadb.jdbc:mariadb-java-client
mariadb.class=org.mariadb.jdbc.Driver
mariadb.version=${mariadb.version}

sqlserver.name=Microsoft JDBC Driver for SQL Server
sqlserver.package=com.microsoft.sqlserver:mssql-jdbc
sqlserver.class=com.microsoft.sqlserver.jdbc.SQLServerDriver
sqlserver.version=${mssql.version}

oracle.name=Oracle JDBC Driver
oracle.package=com.oracle.database.jdbc:ojdbc11
oracle.class=oracle.jdbc.OracleDriver
oracle.version=${oracle.version}

sqlite.name=SQLite JDBC
sqlite.package=org.xerial:sqlite-jdbc
sqlite.class=org.sqlite.JDBC
sqlite.version=${sqlite.version}
