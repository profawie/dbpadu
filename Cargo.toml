[workspace]
members = ["crates/*"]
# Plain `cargo build`, `cargo test` and `cargo clippy` cover every crate.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
# Keep the same as the version in engine/pom.xml.
version = "0.1.0"
edition = "2024"
repository = "https://github.com/profawie/dbpadu"
rust-version = "1.92"

# Every third-party library, in one place.
[workspace.dependencies]
directories = "6.0"
eframe = "0.37"
egui_extras = "0.37"
keyring = "4.2"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlformat = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }

# The app's own crates.
dbpadu-core = { path = "crates/core" }
dbpadu-engine = { path = "crates/engine" }

[package]
name = "dbpadu"
description = "Friendly desktop database client: Rust app, Java query engine"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dbpadu-core.workspace = true
dbpadu-engine.workspace = true
eframe.workspace = true
egui_extras.workspace = true
rfd.workspace = true
uuid.workspace = true

# Release builds favour a small program: the database and the network are
# slower than the app long before code speed matters. Panics still unwind.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
